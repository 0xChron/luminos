name: backfill ELT Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        type: string

jobs:
  validate-inputs:
    name: Validate Date Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate date format and range
        run: |
          # Validate date format
          if ! date -d "${{ inputs.start_date }}" >/dev/null 2>&1; then
            echo "Error: Invalid start_date format. Use YYYY-MM-DD"
            exit 1
          fi
          if ! date -d "${{ inputs.end_date }}" >/dev/null 2>&1; then
            echo "Error: Invalid end_date format. Use YYYY-MM-DD"
            exit 1
          fi
          
          # Check start <= end
          if [[ "${{ inputs.start_date }}" > "${{ inputs.end_date }}" ]]; then
            echo "Error: start_date must be <= end_date"
            exit 1
          fi
          
          # Check not future dates
          TODAY=$(date +%Y-%m-%d)
          if [[ "${{ inputs.end_date }}" > "$TODAY" ]]; then
            echo "Error: Cannot backfill future dates"
            exit 1
          fi
          
          echo "✓ Validation passed: ${{ inputs.start_date }} to ${{ inputs.end_date }}"

  backfill-solar:
    name: Backfill Solar Data
    runs-on: ubuntu-latest
    needs: validate-inputs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: uv sync

      - name: Run solar backfill job
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DEVICE_SN: ${{ secrets.DEVICE_SN }}
          STATION_ID: ${{ secrets.STATION_ID }}
          PROD_DUCKDB_PATH: ${{ secrets.PROD_DUCKDB_PATH }}
        run: uv run python -m ingest.jobs.backfill_solar_job --start-date ${{ inputs.start_date }} --end-date ${{ inputs.end_date }}

  backfill-weather:
    name: Backfill Weather Data
    runs-on: ubuntu-latest
    needs: validate-inputs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: uv sync

      - name: Run weather backfill job
        env:
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          PROD_DUCKDB_PATH: ${{ secrets.PROD_DUCKDB_PATH }}
        run: uv run python -m ingest.jobs.backfill_weather_job --start-date ${{ inputs.start_date }} --end-date ${{ inputs.end_date }}

  dbt-transformations:
    name: dbt Transformations
    runs-on: ubuntu-latest
    needs: [backfill-solar, backfill-weather]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.10'

      - name: Install dbt dependencies
        run: uv sync

      - name: Install dbt packages
        env:
          PROD_DUCKDB_PATH: ${{ secrets.PROD_DUCKDB_PATH }}
        run: |
          uv run dbt deps --project-dir transform --profiles-dir transform

      - name: Run dbt build
        env:
          PROD_DUCKDB_PATH: ${{ secrets.PROD_DUCKDB_PATH }}
        run: |
          uv run dbt build --project-dir transform --profiles-dir transform --target prod

