[project]
name = "luminos"
version = "0.1.0"
description = "from raw irradiance to insight. a solar data platform built for engineering, visualization, and analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.11.6",
    "dbt-duckdb>=1.10.1",
    "dotenv>=0.9.9",
    "duckdb>=1.4.4",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openmeteo-requests>=1.7.5",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "requests-cache>=1.3.0",
    "retry-requests>=2.0.0",
    "seaborn>=0.13.2",
]
