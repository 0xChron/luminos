version: 2

models:
  - name: fact_solar_daily
    description: Fact table for daily solar energy data
    columns: 
      - name: date
        description: Date in YYYY-MM-DD format
        tests:
          - not_null
          - unique
      - name: generation_kwh
        description: Generation of solar energy in kWh
      - name: consumption_kwh
        description: Consumption of solar energy in kWh
      - name: grid_feed_in_kwh
        description: Total solar energy fed into the grid in kWh
      - name: grid_purchase_kwh
        description: Total solar energy purchased from the grid in kWh
      - name: charge_kwh
        description: Total power used to charge the battery in kWh
      - name: discharge_kwh
        description: Total power discharged from the battery in kWh
  
  - name: fact_weather_daily
    description: Fact table for daily weather data
    columns: 
      - name: date
        description: Date in YYYY-MM-DD format
        tests:
          - not_null
          - unique
      - name: shortwave_radiation_sum
        description: Total solar radiation (MJ/m²)
      - name: sunshine_duration
        description: Sunshine duration (seconds)
      - name: daylight_duration
        description: Daylight duration (seconds)
      - name: cloud_cover_mean
        description: Average cloud cover percentage (%)
      - name: temperature_2m_mean
        description: Mean temperature (°C)
      - name: relative_humidity_2m_mean
        description: Mean relative humidity at 2m (%)
      - name: rain_sum
        description: Total rainfall in the day (mm)
      - name: wind_speed_10m_mean
        description: Average wind speed at 10m height (km/h)
      - name: weather_code
        description: WMO weather code (0-99)

  - name: fact_weather_hourly
    description: Fact table for hourly weather data
    columns:
      - name: date
        description: Date in YYYY-MM-DD format
        tests:
          - not_null
      - name: hour_ts
        description: Hour timestamp in YYYY-MM-DD HH:00:00 format
        tests:
          - not_null
      - name: relative_humidity_2m
        description: Relative humidity at 2m (%)
      - name: wind_speed_10m
        description: Wind speed at 10m height (km/h)
      - name: is_day
        description: Indicator if it is daytime (true) or night time (false)
      - name: sunshine_duration
        description: Sunshine duration in the hour (seconds)
      - name: temperature_2m
        description: Temperature at 2m height (°C)
      - name: cloud_cover
        description: Cloud cover percentage (%)
      - name: rain
        description: Rainfall in the hour (mm)
      - name: weather_code
        description: WMO weather code (0-99)